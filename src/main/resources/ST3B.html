<!doctype html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
   <meta http-equiv="content-type" content="text/html; charset=utf-8" />
   <meta name="viewport" content="width=device-width">

   <title>ST3B</title>
   
   <link rel='stylesheet' type='text/css' href='common.css' />
   <link rel='stylesheet' type='text/css' href='ST3A.css' />

</head>

<body onload="data()">
   <div class='topnav'>
      <a href='/'>Homepage</a>
      <a href='mission.html'>Our Mission</a>
      <a href='page2A.html'>Sub Task 2.A</a>
      <a href='page2B.html'>Sub Task 2.B</a>
      <a href='page3A.html'>Sub Task 3.A</a>

   </div>
   
   <div class='header'>
      <h1 th:text="${title}"></h1>
  </div>

  <div class='content'>


    <form id="3Bform" action="/page3B.html" method="post">

        <div class="form-group">
            <label for="select-dataset-field">Select a dataset to get started :</label>
            <select name="select-dataset-field" id="select-dataset-field" onchange="data(event)">
                <option value="">Select a dataset</option>
                <option value="school-completion-field">School Completion</option>
                <option value="non-school-completion-field">Non-School Completion</option>
                <option value="Population-field">Population</option>
                <option value="Health-condition-field">Health Condition</option>
            </select>
        </div>
    </form>

    <div id="Population-field">
        <form id="3Bform-pop" action="/page3B.html" method="post">
            <div id="indig-status-field" class="form-group">
                <label for='indig-status-drop'>Select Indigenous Status</label>
                <select id='indig-status-drop' name='indig-status-drop'>
                    <option value="'indig'">Indigenous</option>
                    <option value="'non_indig'">non-Indigenous</option>
                    <option value="'indig' OR indigenous_status = 'non_indig'">both</option>
                </select>
            </div>
    
            <div id="census-year-field" class="form-group">
                <label for='census-year-drop'>Select Census Year</label>
                <select id='census-year-drop' name='census-year-drop'>
                    <option value="2016">2016 census</option>
                    <option value="2021">2021 census</option>
                </select>
            </div>
            
            <div id="lga-field" class="form-group">
                <label for="lga-field-drop">Select an LGA to find other similar LGAs</label>
                <select name="lga-field-drop" id="lga-field-drop">
                    <option th:each="lga : ${lgas}" th:text="${lga.getCode() + '-' + lga.getName()}" th:value="${lga.getCode()}">
                    </option>
                </select>
            </div>
    
            <div id="limit" class="form-group">
                <label for="limit">Set how many similar LGAs to be retrieved</label>
                <input name = "limit" id = "limit" type="number" min= "0" max = "999" value="5">
            </div>

            <div id="Population" class="form-group">
                <label for="min-age">select a minimum age:</label>
                <input id = "min-age" type="number" min= "0" max = "200" value="0">
                <label for="max-age">select a maximum age:</label>
                <input id = "max-age" type="number" min= "0" max = "200" value="200">
            </div>

            
            <input id="3BformSubmit" type="submit" value="submit" class="submit-btn">
        </form>
    </div>

    <div id="school-completion-field">
        <form id="3Bform-pop" action="/page3B.html" method="post">
            <div id="indig-status-field" class="form-group">
                <label for='indig-status-drop'>Select Indigenous Status</label>
                <select id='indig-status-drop' name='indig-status-drop'>
                    <option value="'indig'">Indigenous</option>
                    <option value="'non_indig'">non-Indigenous</option>
                    <option value="'indig' OR indigenous_status = 'non_indig'">both</option>
                </select>
            </div>
    
            <div id="census-year-field" class="form-group">
                <label for='census-year-drop'>Select Census Year</label>
                <select id='census-year-drop' name='census-year-drop'>
                    <option value="2016">2016 census</option>
                    <option value="2021">2021 census</option>
                </select>
            </div>
            
            <div id="lga-field" class="form-group">
                <label for="lga-field-drop">Select an LGA to find other similar LGAs</label>
                <select name="lga-field-drop" id="lga-field-drop">
                    <option th:each="lga : ${lgas}" th:text="${lga.getCode() + '-' + lga.getName()}" th:value="${lga.getCode()}">
                    </option>
                </select>
            </div>
    
            <div id="limit" class="form-group">
                <label for="limit">Set how many similar LGAs to be retrieved</label>
                <input name = "limit" id = "limit" type="number" min= "0" max = "999" value="5">
            </div>

            <div id="school-completion" class="form-group">
                <div class='form-group'>
                    <label for="minSchool_drop">select the lowest level of school completion:</label>
                    <select id = "minSchool_drop" name = "minSchool_drop">
                        <option value = "0">did not go to school</option>
                        <option value = "1">year 8</option>
                        <option value = "2">year 9</option>
                        <option value = "3">year 10</option>
                        <option value = "4">year 11</option>
                        <option value = "5">year 12+</option>
                    </select>
    
                    <br>
    
                    <label for="minSchool_drop">select the highest level of school completion:</label>
                    <select id = "maxSchool_drop" name = "maxSchool_drop">
                        <option value = "0">did not go to school</option>
                        <option value = "1">year 8</option>
                        <option value = "2">year 9</option>
                        <option value = "3">year 10</option>
                        <option value = "4">year 11</option>
                        <option value = "5">year 12+</option>
                    </select>
                </div>
            </div>

            <input id="3BformSubmit" type="submit" value="submit" class="submit-btn">
        </form>
    </div>

    <div id="non-school-completion-field">
        <form id="3Bform-pop" action="/page3B.html" method="post">
            <div id="indig-status-field" class="form-group">
                <label for='indig-status-drop'>Select Indigenous Status</label>
                <select id='indig-status-drop' name='indig-status-drop'>
                    <option value="'indig'">Indigenous</option>
                    <option value="'non_indig'">non-Indigenous</option>
                    <option value="'indig' OR indigenous_status = 'non_indig'">both</option>
                </select>
            </div>
    
            <div id="census-year-field" class="form-group">
                <label for='census-year-drop'>Select Census Year</label>
                <select id='census-year-drop' name='census-year-drop'>
                    <option value="2016">2016 census</option>
                    <option value="2021">2021 census</option>
                </select>
            </div>
            
            <div id="lga-field" class="form-group">
                <label for="lga-field-drop">Select an LGA to find other similar LGAs</label>
                <select name="lga-field-drop" id="lga-field-drop">
                    <option th:each="lga : ${lgas}" th:text="${lga.getCode() + '-' + lga.getName()}" th:value="${lga.getCode()}">
                    </option>
                </select>
            </div>
    
            <div id="limit" class="form-group">
                <label for="limit">Set how many similar LGAs to be retrieved</label>
                <input name = "limit" id = "limit" type="number" min= "0" max = "999" value="5">
            </div>

            <div id="non-school-completion" class="form-group">
                <label for="non-school-completion-drop">Select non-school completion category</label>
                <select name="non-school-completion-drop" id="non-school-completion-drop">
                    <option value="">Select a completion level</option>
                    <option th:each="category : ${completion_categories}" th:text="${category}" th:value="${category}"></option>
                </select>
            </div>

            <input id="3BformSubmit" type="submit" value="submit" class="submit-btn">
        </form>
    </div>

    <div id="Health-condition-field">
        
        <div id="reminder-message-HC" class="reminder-message">
            <span>This data is only available for 2021 census</span>
        </div>
        <form id="3Bform-pop" action="/page3B.html" method="post">
            <div id="indig-status-field" class="form-group">
                <label for='indig-status-drop'>Select Indigenous Status</label>
                <select id='indig-status-drop' name='indig-status-drop'>
                    <option value="'indig'">Indigenous</option>
                    <option value="'non_indig'">non-Indigenous</option>
                    <option value="'indig' OR indigenous_status = 'non_indig'">both</option>
                </select>
            </div>
    
            <div id="census-year-field" class="form-group">
                <label for='census-year-drop'>Select Census Year</label>
                <select id='census-year-drop' name='census-year-drop'>
                    <option value="2016" disabled>2016 census</option>
                    <option value="2021">2021 census</option>
                </select>
            </div>
            
            <div id="lga-field" class="form-group">
                <label for="lga-field-drop">Select an LGA to find other similar LGAs</label>
                <select name="lga-field-drop" id="lga-field-drop">
                    <option th:each="lga : ${lgas}" th:text="${lga.getCode() + '-' + lga.getName()}" th:value="${lga.getCode()}">
                    </option>
                </select>
            </div>
    
            <div id="limit" class="form-group">
                <label for="limit">Set how many similar LGAs to be retrieved</label>
                <input name = "limit" id = "limit" type="number" min= "0" max = "999" value="5">
            </div>

            <div id="Health-condition" class="form-group">
            <label for="Health-condition-drop">Select Long-term Health condition</label>
            <select name="Health-condition-drop" id="Health-condition-drop">
                <option th:each="condition : ${health_conditions}" th:text="${condition}" th:value="${condition}"></option>
            </select>
            
            <!-- <div th:each="condition : ${health_conditions}">
                <input th:id="${condition}" type="checkbox" th:text="${condition}" th:value="${condition}">
            </div> -->
        </div>

            <input id="3BformSubmit" type="submit" value="submit" class="submit-btn">
        </form>
    </div>


    <div id="data-view">
        <div id="table-view">
            <div id="school-completion-view" th:if="${#lists.size(sc_data) > 0}">
                <h6 th:text="${filters}"></h6>
                <table>
                    <thead>
                        <tr>
                            <th> LGA name/code </th>
                            <th> no. people </th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="data : ${sc_data}">
                            <td><span th:text="${data.getLgaCode() + ' - ' + data.getLgaName()}"> LGA name/code </span></td>
                            <td><span th:text="${data.getData()}"> no. people </span></td>
                        </tr>
                    </tbody>
                </table>
            </div>
            </div>

            <div id="non-school-completion-view" th:if="${#lists.size(data_nsc) > 0}">
                <h6 th:text="${filters_nsc}"></h6>
                <table>
                    <thead>
                        <tr>
                            <th> LGA name/code </th>
                            <th> no. people </th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="data : ${data_nsc}">
                            <td><span th:text="${data.getLgaCode() + ' - ' + data.getLgaName()}"> LGA name/code </span></td>
                            <td><span th:text="${data.getData()}"> no. people </span></td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- <div id="population-view" th:if="${#lists.size(pop-data) > 0}">

            </div>

            <div id="health-condition-view" th:if="${#lists.size(hc-data) > 0}">

            </div> -->
        </div>
    </div>

   </div>

   <div class='footer'>
      <p>COSC2803 - studio project</p>
   </div>

   <script>
            //hide all fields at the start
            let SCField = document.getElementById("school-completion-field");
            let NSCField = document.getElementById("non-school-completion-field");
            let populationField = document.getElementById("Population-field");
            let HCField = document.getElementById("Health-condition-field");
            
            SCField.style.display = "none";
            NSCField.style.display = "none";
            populationField.style.display = "none";
            HCField.style.display = "none";

        //based on option show fields
        function data(event) {
            if (event.target.value === "school-completion-field") {
                showSCField();
            }
            else if (event.target.value === "non-school-completion-field") {
                showNSCField();
            }
            else if (event.target.value === "Population-field") {
                showPopulationField();
            }
            else if (event.target.value === "Health-condition-field") {
                showHCField();
            } else {
                hideAllFields();
            }
        }
        function hideAllFields() {

            SCField.style.display = "none";
            NSCField.style.display = "none";
            populationField.style.display = "none";
            HCField.style.display = "none";

        }

        function showSCField() {

            SCField.style.display = "block";
            NSCField.style.display = "none";
            populationField.style.display = "none";
            HCField.style.display = "none";

        }

        function showNSCField() {

            SCField.style.display = "none";
            NSCField.style.display = "block";
            populationField.style.display = "none";
            HCField.style.display = "none";
        }

        function showPopulationField() {

            SCField.style.display = "none";
            NSCField.style.display = "none";
            populationField.style.display = "block";
            HCField.style.display = "none";

        }

        function showHCField() {


            SCField.style.display = "none";
            NSCField.style.display = "none";
            populationField.style.display = "none";
            HCField.style.display = "block";

        }
    </script>
</body>
</html>
