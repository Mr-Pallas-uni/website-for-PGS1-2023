<!doctype html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
   <title>Homepage</title>
   <link rel='stylesheet' type='text/css' href='common.css' />
   <link rel='stylesheet' type='text/css' href='ST3A.css' />

   <script>
    function data1() {
        var d1 = document.getElementById("dataset1");
        var d2 = document.getElementById("dataset2");
        var d3 = document.getElementById("dataset3");
        var gs = document.getElementById("genderstatus")
        
        gs.style.display = "block"
        d1.style.display = "block"
        d2.style.display = "none"
        d3.style.display = "none"
    }

    function data2() {
        var d1 = document.getElementById("dataset1");
        var d2 = document.getElementById("dataset2");
        var d3 = document.getElementById("dataset3");
        var gs = document.getElementById("genderstatus")

        gs.style.display = "block"
        d1.style.display = "none"
        d2.style.display = "block"
        d3.style.display = "none"
    }

    function data3() {
        var d1 = document.getElementById("dataset1");
        var d2 = document.getElementById("dataset2");
        var d3 = document.getElementById("dataset3");
        var gs = document.getElementById("genderstatus")
        
        gs.style.display = "block"
        d1.style.display = "none"
        d2.style.display = "none"
        d3.style.display = "block"
    }
    </script> 

</head>

<body>
   <div class='topnav'>
      <a href='/'>Homepage</a>
      <a href='mission.html'>Our Mission</a>
      <a href='page2A.html'>Sub Task 2.A</a>
      <a href='page2B.html'>Sub Task 2.B</a>
      <a href='page3A.html'>Sub Task 3.A</a>
      <a href='page3B.html'>Sub Task 3.B</a>
   </div>
   
   <div class='header'>
      <h1 th:text="${title}"></h1>
  </div>

  <div class='content'>

    <form action='/page3A.html' method = 'post'>
        <div class='form-group'>
            <label for='datasets_drop'>Select the Dataset:</label>
            <select id='datasets_drop' name='datasets_drop'>
                <!-- This is where the movies types are populated -->
                <option onclick="data1()">School Completion</option>
                <option onclick="data2()">Non-School Completion</option>
                <option onclick="data3()">Population</option>
            </select>
        </div>

        <div id= 'genderstatus' class='form-group'>
            <label>Select Indigenous Status and Sex:</label>
            <select id='gender_drop' name='gender_drop'>
                <!-- This is where the movies types are populated -->
                <option th:each="gender : ${gender_drop}" th:text="${gender}" ></option>
            </select>
            <select id='indigenous_drop' name='indigenous_drop'>
                <!-- This is where the movies types are populated -->
                <option th:each="status : ${indigenous_drop}" th:text="${status}" ></option>
            </select>
        </div>

        <div class = dataset id=dataset1>
            <div class='form-group'>
                <input type="number" min= "0">
            </div>
            <button type='submit' class='btn btn-primary'>Submit</button>
        </div>
    
        <div class = dataset id=dataset2>
            <div class='form-group'>
                <p>data2</p>
            </div>
            <button type='submit' class='btn btn-primary'>Submit</button>
        </div>

        <div class = dataset id=dataset3>
            <div class='form-group'>
                <p>data3</p>
            </div>
            <button type='submit' class='btn btn-primary'>Submit</button>
        </div>
    </form>


   </div>

   <div class='footer'>
      <p>COSC2803 - studio project</p>
   </div>

</body>
</html>
