<!doctype html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
   <meta http-equiv="content-type" content="text/html; charset=utf-8">
   <meta name="viewport" content="width=device-width">
   <title>Homepage</title>
   
   <link rel='stylesheet' type='text/css' href='common.css'>
   <link rel='stylesheet' type='text/css' href='ST3A.html'>

</head>

<body onload="data1()">
   <div class='topnav'>
      <a href='/'>Homepage</a>
      <a href='mission.html'>Our Mission</a>
      <a href='page2A.html'>Sub Task 2.A</a>
      <a href='page2B.html'>Sub Task 2.B</a>
      <a href='page3A.html'>Sub Task 3.A</a>
      <a href='page3B.html'>Sub Task 3.B</a>
   </div>
   
   <div class='header'>
      <h1 th:text="${title}"></h1>
   </div>

  <div class='content'>

    <!-- data set 1 form-->
    <form action='/page3A.html' method = 'post' class = 'container'>
        <div class='form-group'>
            <label for='datasets_drop1'>Select the Dataset:</label>
            <select id='datasets_drop1' name='datasets_drop1' onchange="data(event)">
                <!-- This is where the movies types are populated -->
                <option>School Completion</option>
                <option>Non-School Completion</option>
                <option>Population</option>
            </select>
        </div>

        <div class="break"></div>

        <label for='genderstatus1'>select the first group for comparison</label>
        <div id= 'genderstatus1'>
            <label for='genderstatus1'>select the first group for comparison</label>
            <div class='form-group'>
                <label for='gender_drop1'>Select Sex</label><br>
                <select id='gender_drop1' name='gender_drop1'>
                    <!-- This is where the movies types are populated -->
                    <option th:each="gender : ${gender_drop1}" th:text="${gender}" ></option>
                </select>
            <br>
                <label for='indigenous_drop1'>Select Indigenous Status</label>
                <select id='indigenous_drop1' name='indigenous_drop1'>
                    <!-- This is where the movies types are populated -->
                    <option th:each="status : ${indigenous_drop1}" th:text="${status}" ></option>
                </select>
            </div>
        </div>
        <div id= 'genderstatus2'>
            <label for='genderstatus2'>select the second group for comparison</label>
            <div class='form-group'>
                <label for='gender_drop2'>Select Sex</label><br>
                <select id='gender_drop2' name='gender_drop2'>
                    <!-- This is where the movies types are populated -->
                    <option th:each="gender : ${gender_drop2}" th:text="${gender}" ></option>
                </select>
            <br>
                <label for='indigenous_drop2'>Select Indigenous Status</label>
                <select id='indigenous_drop2' name='indigenous_drop2'>
                    <!-- This is where the movies types are populated -->
                    <option th:each="status : ${indigenous_drop2}" th:text="${status}" ></option>
                </select>
            </div>
        </div>

        <div class="break"></div>

        <div id=dataset1>
            <div class='form-group'>
                <label for='minSchool_drop1'>select the lowest level of school completion:</label>
                <select id = "minSchool_drop1" name = "minSchool_drop1">
                    <option value = "0">did not go to school</option>
                    <option value = "1">year 8</option>
                    <option value = "2">year 9</option>
                    <option value = "3">year 10</option>
                    <option value = "4">year 11</option>
                    <option value = "5">year 12+</option>
                </select>
                <br>
                <label for="maxSchool_drop1">select the highest level of school completion:</label>
                <select id = "maxSchool_drop1" name = "maxSchool_drop1">
                    <option value = "0">did not go to school</option>
                    <option value = "1">year 8</option>
                    <option value = "2">year 9</option>
                    <option value = "3">year 10</option>
                    <option value = "4">year 11</option>
                    <option value = "5">year 12+</option>
                </select>

            </div>
            <button type='submit' class='btn btn-primary'>Submit</button>
        </div>
    
        <div id=dataset2>
            <div class='form-group'>
                <p>select some levels of post-graduate degrees:</p>
                <input type = "checkbox" id = "degree11" value="pd_gd_gc">
                <label for="degree11">Postgraduate Degree, Graduate Diploma, and Graduate Certificate Level</label><br>
                <input type = "checkbox" id = "degree21" value="bd">
                <label for="degree21">Bachelors degree level</label><br>
                <input type = "checkbox" id = "degree31" value="adip_dip">
                <label for="degree31">Advanced diploma and diploma level</label><br>
                <input type = "checkbox" id = "degree41" value="ct_i_ii">
                <label for="degree41">certificate i & ii level</label><br>
                <input type = "checkbox" id = "degree51" value="ct_iii_iv">
                <label for="degree51">certificate iii & iv level</label><br>
            </div>
            <button type='submit' class='btn btn-primary'>Submit</button>
        </div>

        <div id=dataset3>
            <div class='form-group'>
                <label for="min1">select a minimum age:</label>
                <input id = "min1" type="number" min= "0" max = "200">
                <label for="max1">select a maximum age:</label>
                <input id = "max1" type="number" min= "0" max = "200">
            </div>
            <button type='submit' class='btn btn-primary'>Submit</button>
        </div>
    </form>

    <div id = "Error">
        nothing for now lol
    </div>
   </div>

   <div class='footer'>
    <script>
        function data(event) {
            if (event.target.value === "School Completion") {
                data1();
            }
            else if (event.target.value === "Non-School Completion") {
                data2();
            }
            else if (event.target.value === "Population") {
                data3();
            }
            
        }
        function data1() {
            var d1 = document.getElementById("dataset1");
            var d2 = document.getElementById("dataset2");
            var d3 = document.getElementById("dataset3");
            
            d1.style.display = "block"
            d2.style.display = "none"
            d3.style.display = "none"
        }
    
        function data2() {
            var d1 = document.getElementById("dataset1");
            var d2 = document.getElementById("dataset2");
            var d3 = document.getElementById("dataset3");
    
            d1.style.display = "none"
            d2.style.display = "block"
            d3.style.display = "none"
        }
    
        function data3() {
            var d1 = document.getElementById("dataset1")
            var d2 = document.getElementById("dataset2")
            var d3 = document.getElementById("dataset3")

            d1.style.display = "none"
            d2.style.display = "none"
            d3.style.display = "block"
    
        }
        </script> 
      <p>COSC2803 - studio project</p>
   </div>

</body>
</html>
